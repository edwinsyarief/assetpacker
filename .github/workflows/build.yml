name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.0'

    - name: Vet
      run: go vet ./...

    - name: Build
      run: go build -v ./...

    - name: Build WASM
      env:
        GOOS: js
        GOARCH: wasm
      run: go build ./...

    - name: Test
      run: go test -race -v -count=1 ./...

    - name: Benchmarks
      run: go test -run=^$ -bench=. -benchmem ./...
